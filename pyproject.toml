[project]
name = "chatbot-lib"
version = "0.1.0"
description = "A beginner-friendly, provider-agnostic chatbot library with offline/local model support"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Shahzeel Ahmad" }]
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
all = ["openai>=1.0.0", "anthropic>=0.25.0"]
dev = ["pytest>=7.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chatbot_lib*"]
